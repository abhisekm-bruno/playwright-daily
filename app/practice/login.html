<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in &middot; Acme Practice</title>
  <link rel="stylesheet" href="/practice/practice.css" />
</head>
<body>
  <header class="topbar">
    <span class="logo">Acme Practice</span>
    <nav>
      <a href="/practice/index.html">Practice home</a>
      <a href="/practice/signup.html">Create account</a>
    </nav>
  </header>

  <main class="container narrow">
    <h1>Sign in</h1>
    <p class="lede">Use <code>ada@example.com</code> / <code>playwright123</code>.</p>

    <div class="panel">
      <div class="alert" role="alert" id="error" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>

        <div class="choice" style="margin-bottom:18px">
          <input id="remember" name="remember" type="checkbox" />
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" id="submit">Sign in</button>
      </form>
    </div>
  </main>

  <script>
    const VALID = { email: 'ada@example.com', password: 'playwright123', name: 'Ada Lovelace' };

    const form = document.getElementById('login-form');
    const error = document.getElementById('error');
    const submit = document.getElementById('submit');

    const showError = (message) => {
      error.textContent = message;
      error.hidden = false;
    };

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      error.hidden = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Email and password are both required.');
        return;
      }

      submit.disabled = true;
      submit.textContent = 'Signing in...';

      // A short delay so tests have something real to wait on.
      setTimeout(() => {
        if (email.toLowerCase() === VALID.email && password === VALID.password) {
          sessionStorage.setItem('acme:user', JSON.stringify({ email: VALID.email, name: VALID.name }));
          window.location.assign('/practice/dashboard.html');
          return;
        }
        submit.disabled = false;
        submit.textContent = 'Sign in';
        showError('Invalid email or password.');
      }, 350);
    });
  </script>
</body>
</html>
